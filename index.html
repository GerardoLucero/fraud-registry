<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Radar Urbano — reporta y consulta fraudes, robos y asaltos cerca de ti</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #e34a4a;
    --accent-dark: #b93838;
    --safe: #4ac97f;
    --warn: #e3b34a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  /* ---- Layout: barra compacta de marca arriba, mapa ocupa todo lo demás ---- */
  #app { height: 100dvh; display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.9rem;
    padding: 0.55rem 1rem;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    z-index: 20;
  }
  header h1 {
    font-size: 1rem;
    margin: 0;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  /* ---- Ventana de tiempo: slider de días en el header ---- */
  #time-control {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 240px;
  }
  #time-filter-label {
    flex: 0 0 auto;
    font-size: 0.78rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  #time-filter {
    -webkit-appearance: none;
    appearance: none;
    flex: 1 1 auto;
    min-width: 70px;
    width: auto;
    height: 28px;
    padding: 0;
    margin: 0;
    border: none;
    background: transparent;
    cursor: pointer;
  }
  #time-filter:focus { outline: none; }
  #time-filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
  #time-filter::-webkit-slider-runnable-track {
    height: 4px;
    border-radius: 999px;
    background: var(--border);
  }
  #time-filter::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: var(--border);
  }
  #time-filter::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    margin-top: -7px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }
  #time-filter::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--card);
    box-shadow: 0 1px 4px rgba(0,0,0,0.5);
  }

  .search-row { display: flex; gap: 0.5rem; }
  .search-row input {
    flex: 1;
    min-width: 0;
  }
  .search-row button {
    flex: 0 0 auto;
    width: auto;
    padding: 0.85rem 1.1rem;
  }

  input, textarea, button {
    font-size: 1rem;
    font-family: inherit;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #12141a;
    color: var(--text);
    padding: 0.85rem;
  }
  input, textarea { width: 100%; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  textarea { resize: vertical; min-height: 90px; margin-top: 0.5rem; }
  button {
    background: var(--accent);
    border: none;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.5; cursor: wait; }

  /* ---- Resultados de búsqueda: dentro del panel de búsqueda ---- */
  #search-results {
    position: relative;
  }
  #search-results:not(:empty) {
    margin-top: 0.6rem;
  }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.85rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .badge {
    display: inline-block;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
  }
  .badge-high { background: rgba(227,74,74,0.15); color: var(--accent); }
  .badge-low { background: rgba(227,179,74,0.15); color: var(--warn); }
  .badge-none { background: rgba(74,201,127,0.15); color: var(--safe); }
  .muted { color: var(--muted); font-size: 0.85rem; }
  .result-card p { margin: 0.3rem 0; }

  /* ---- Mapa: el elemento dominante de la pantalla ---- */
  #map-wrap { flex: 1 1 auto; position: relative; min-height: 0; }
  /* z-index explícito para que #map cree su propio stacking context --
     sin esto, los panes internos de Leaflet (hasta z-index:1000) se comparan
     directo contra el FAB y le ganan aunque esté después en el DOM. */
  #map { width: 100%; height: 100%; position: relative; z-index: 0; }
  .map-caption {
    position: absolute;
    bottom: 0.75rem;
    left: 0.75rem;
    background: rgba(26,29,36,0.9);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.35rem 0.85rem;
    font-size: 0.78rem;
    color: var(--muted);
    z-index: 10;
    pointer-events: none;
  }

  /* ---- Tres acciones flotantes pares: buscar / zona / reportar ---- */
  #map-actions {
    position: absolute;
    right: 1rem;
    bottom: 1.25rem;
    z-index: 15;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.55rem;
    max-width: calc(100% - 2rem);
  }
  #map-actions button {
    width: auto;
    max-width: 100%;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 1.25rem;
    border-radius: 999px;
    font-size: 0.92rem;
    white-space: nowrap;
  }
  #map-actions svg { width: 18px; height: 18px; flex: none; }
  .fab-secondary {
    background: rgba(26,29,36,0.95);
    border: 1px solid var(--border);
    color: var(--text);
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  .fab-secondary:hover { background: #232730; }
  #fab { box-shadow: 0 8px 24px rgba(227,74,74,0.45); }

  /* ---- Paneles bajo demanda (reportar / buscar número) ---- */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 30;
  }
  .sheet-overlay.open { display: flex; }
  .sheet {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
    max-height: 85vh;
    overflow-y: auto;
  }
  @media (min-width: 600px) {
    .sheet-overlay { align-items: center; }
    .sheet { border-radius: 16px; max-height: 90vh; }
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 0.75rem;
  }
  .modal-header h2 { font-size: 1.05rem; margin: 0; }
  .sheet-close {
    width: auto;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.4rem;
    line-height: 1;
    padding: 0.25rem 0.5rem;
    cursor: pointer;
  }
  .sheet-close:hover { background: transparent; color: var(--text); }
  .sheet-intro { margin: 0 0 0.85rem; }
  .status-msg { font-size: 0.9rem; margin-top: 0.5rem; }
  .status-ok { color: var(--safe); }
  .status-err { color: var(--accent); }

  #location-row {
    margin-top: 0.5rem;
    display: flex;
    gap: 0.6rem;
    align-items: center;
  }
  #use-location-btn {
    width: auto;
    flex: none;
    background: #12141a;
    border: 1px solid var(--border);
    font-weight: 500;
    padding: 0.6rem 0.9rem;
    font-size: 0.9rem;
  }
  #use-location-btn:hover { background: #1a1d24; }
  #report-location-text { margin-top: 0.5rem; }

  /* ---- Leyenda de capas del mapa ---- */
  .badge-phone { background: rgba(227,74,74,0.15); color: var(--accent); }
  .badge-incident { background: rgba(120,140,255,0.15); color: #8ca0ff; }

  /* ---- Toast del resumen de zona ---- */
  #zone-toast {
    position: absolute;
    top: 0.75rem;
    left: 0.75rem;
    right: 0.75rem;
    max-width: 480px;
    margin: 0 auto;
    z-index: 20;
    display: flex;
    align-items: flex-start;
    gap: 0.6rem;
    background: rgba(26,29,36,0.97);
    border: 1px solid var(--border);
    border-left: 4px solid var(--muted);
    border-radius: 10px;
    padding: 0.85rem 0.9rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    opacity: 0;
    transform: translateY(-140%);
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  #zone-toast.visible { opacity: 1; transform: none; pointer-events: auto; }
  #zone-toast.tone-alert { border-left-color: var(--accent); }
  #zone-toast.tone-clear { border-left-color: var(--safe); }
  #zone-toast-text { flex: 1; font-size: 0.88rem; line-height: 1.45; }
  #zone-toast-title {
    display: block;
    font-weight: 700;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin-bottom: 0.25rem;
  }
  #zone-toast.tone-alert #zone-toast-title { color: var(--accent); }
  #zone-toast.tone-clear #zone-toast-title { color: var(--safe); }
  #zone-toast-close {
    width: auto;
    flex: none;
    background: transparent;
    border: none;
    color: var(--muted);
    font-size: 1.3rem;
    line-height: 1;
    padding: 0 0.25rem;
    cursor: pointer;
  }
  #zone-toast-close:hover { background: transparent; color: var(--text); }

  /* ---- Filtros de categoría sobre el mapa ---- */
  #category-chips {
    position: absolute;
    top: 0.75rem;
    left: 0.75rem;
    z-index: 10;
    max-width: 280px;
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem;
    /* el toast entra por arriba: los chips se recorren para no quedar tapados */
    transform: translateY(var(--toast-offset, 0px));
    transition: transform 0.25s ease;
  }
  #category-chips:empty { display: none; }
  .chip {
    padding: 0.3rem 0.65rem;
    border-radius: 999px;
    font-size: 0.75rem;
    background: rgba(26,29,36,0.92);
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.active { background: rgba(140,160,255,0.18); color: #8ca0ff; border-color: #8ca0ff; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Radar Urbano</h1>
    <div id="time-control">
      <input type="range" id="time-filter" min="7" max="90" step="1" value="30" aria-label="Ventana de días a mostrar">
      <span id="time-filter-label">30 días</span>
    </div>
  </header>

  <div id="map-wrap">
    <div id="map"></div>

    <div id="zone-toast" role="status" aria-live="polite">
      <div id="zone-toast-text"></div>
      <button id="zone-toast-close" type="button" aria-label="Cerrar">&times;</button>
    </div>

    <div id="category-chips"></div>

    <div class="map-caption">
      <span class="badge badge-phone" style="margin:0 0.3rem 0 0;">●</span>fraude telefónico (por región)
      <span class="badge badge-incident" style="margin:0 0.3rem 0 0.6rem;">●</span>otros incidentes
    </div>

    <div id="map-actions">
      <button id="fab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Reportar
      </button>
      <button id="search-open-btn" class="fab-secondary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
        Buscar número
      </button>
      <button id="zone-summary-btn" class="fab-secondary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/></svg>
        ¿Qué tan segura es mi zona?
      </button>
    </div>
  </div>
</div>

<div id="search-overlay" class="sheet-overlay">
  <div class="sheet">
    <div class="modal-header">
      <h2>Buscar un número</h2>
      <button id="search-close" class="sheet-close" aria-label="Cerrar">&times;</button>
    </div>
    <p class="muted sheet-intro">Consulta si un número ya fue reportado por fraude telefónico.</p>
    <div class="search-row">
      <input type="tel" id="search-input" placeholder="Ej. 55 1234 5678" autocomplete="tel" inputmode="tel">
      <button id="search-btn">Buscar</button>
    </div>
    <div id="search-results"></div>
  </div>
</div>

<div id="report-overlay" class="sheet-overlay">
  <div id="report-modal" class="sheet">
    <div class="modal-header">
      <h2>Reportar un incidente</h2>
      <button id="report-close" class="sheet-close" aria-label="Cerrar">&times;</button>
    </div>
    <textarea id="report-description" placeholder="¿Qué pasó? Fraude telefónico, robo, asalto, lo que haya sido — no hace falta elegir categoría, nosotros la detectamos." required></textarea>
    <input type="tel" id="report-phone" placeholder="Número de teléfono (si aplica)" autocomplete="tel" inputmode="tel" style="margin-top:0.5rem">
    <div id="location-row">
      <button id="use-location-btn" type="button">📍 Usar mi ubicación</button>
      <span id="location-status" class="muted"></span>
    </div>
    <input type="text" id="report-location-text" placeholder="O escribe la zona/colonia (opcional)">
    <button id="report-btn" style="width:100%; margin-top:0.75rem;">Reportar</button>
    <div id="report-status" class="status-msg"></div>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
  import 'https://esm.sh/leaflet@1.9.4';

  const SUPABASE_URL = 'https://ifcgwnbaiozuvjorkcoc.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Z2tMpWR9mWfzttfralmWag_Aq7xSGkB';

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const normalizePhone = (raw) => raw.replace(/\D/g, '');

  // --- Search (panel bajo demanda) ---
  const searchInput = document.getElementById('search-input');
  const searchBtn = document.getElementById('search-btn');
  const searchResults = document.getElementById('search-results');
  const searchOpenBtn = document.getElementById('search-open-btn');
  const searchOverlay = document.getElementById('search-overlay');
  const searchCloseBtn = document.getElementById('search-close');

  function openSearch() {
    searchOverlay.classList.add('open');
    setTimeout(() => searchInput.focus(), 50);
  }
  function closeSearch() { searchOverlay.classList.remove('open'); }

  searchOpenBtn.addEventListener('click', openSearch);
  searchCloseBtn.addEventListener('click', closeSearch);
  searchOverlay.addEventListener('click', (e) => { if (e.target === searchOverlay) closeSearch(); });

  async function searchNumber() {
    const phone = normalizePhone(searchInput.value);
    if (phone.length < 8) {
      searchResults.innerHTML = '<div class="result-card status-msg status-err">Escribe un número válido.</div>';
      return;
    }
    searchBtn.disabled = true;
    searchResults.innerHTML = '<div class="result-card muted">Buscando...</div>';

    const { data, error } = await supabase
      .from('phone_confidence')
      .select('*')
      .eq('phone_number', phone)
      .maybeSingle();

    searchBtn.disabled = false;

    if (error) {
      searchResults.innerHTML = '<div class="result-card status-msg status-err">Error al buscar. Intenta de nuevo.</div>';
      return;
    }

    if (!data || data.report_count === 0) {
      searchResults.innerHTML = `
        <div class="result-card">
          <span class="badge badge-none">Sin reportes</span>
          <p class="muted">Nadie ha reportado este número todavía. Si te pasó algo, repórtalo con el botón del mapa.</p>
        </div>`;
      return;
    }

    const isHighConfidence = data.report_count >= 3;
    searchResults.innerHTML = `
      <div class="result-card">
        <span class="badge ${isHighConfidence ? 'badge-high' : 'badge-low'}">
          ${isHighConfidence ? 'Alta probabilidad de fraude' : 'Reportado — pocas coincidencias'}
        </span>
        <p>${data.report_count} reporte${data.report_count === 1 ? '' : 's'} único${data.report_count === 1 ? '' : 's'}</p>
        <p class="muted">Último reporte: ${new Date(data.last_reported_at).toLocaleDateString('es-MX')}</p>
      </div>`;
  }

  searchBtn.addEventListener('click', searchNumber);
  searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') searchNumber(); });

  // --- Report modal ---
  const fab = document.getElementById('fab');
  const overlay = document.getElementById('report-overlay');
  const closeBtn = document.getElementById('report-close');
  const reportPhone = document.getElementById('report-phone');
  const reportDescription = document.getElementById('report-description');
  const reportLocationText = document.getElementById('report-location-text');
  const useLocationBtn = document.getElementById('use-location-btn');
  const locationStatus = document.getElementById('location-status');
  const reportBtn = document.getElementById('report-btn');
  const reportStatus = document.getElementById('report-status');

  let capturedLat = null;
  let capturedLon = null;

  function openModal() {
    overlay.classList.add('open');
    setTimeout(() => reportDescription.focus(), 50);
  }
  function closeModal() { overlay.classList.remove('open'); }

  fab.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });

  useLocationBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      locationStatus.textContent = 'Tu navegador no soporta ubicación.';
      return;
    }
    locationStatus.textContent = 'Obteniendo ubicación...';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        capturedLat = pos.coords.latitude;
        capturedLon = pos.coords.longitude;
        locationStatus.textContent = '✓ Ubicación capturada';
      },
      () => {
        locationStatus.textContent = 'No se pudo obtener — escribe la zona abajo.';
      },
      { timeout: 8000 }
    );
  });

  async function submitReport() {
    const phone = normalizePhone(reportPhone.value);
    const description = reportDescription.value.trim();
    const locationText = reportLocationText.value.trim();
    const phoneTyped = reportPhone.value.trim().length > 0;

    if (description.length < 5) {
      reportStatus.textContent = 'Describe qué pasó.';
      reportStatus.className = 'status-msg status-err';
      return;
    }
    if (phoneTyped && phone.length < 8) {
      reportStatus.textContent = 'El número parece incompleto.';
      reportStatus.className = 'status-msg status-err';
      return;
    }
    if (phone.length < 8 && capturedLat === null && !locationText) {
      reportStatus.textContent = 'Agrega un número, tu ubicación, o la zona donde pasó.';
      reportStatus.className = 'status-msg status-err';
      return;
    }

    reportBtn.disabled = true;
    reportStatus.textContent = 'Enviando...';
    reportStatus.className = 'status-msg';

    const payload = { description };
    if (phone.length >= 8) payload.phone_number = phone;
    if (capturedLat !== null) { payload.lat = capturedLat; payload.lon = capturedLon; }
    if (locationText) payload.location_text = locationText;

    const { error } = await supabase.from('reports').insert(payload);

    reportBtn.disabled = false;

    if (error) {
      reportStatus.textContent = error.code === 'rate_limited'
        ? error.message
        : 'No se pudo enviar el reporte. Intenta de nuevo.';
      reportStatus.className = 'status-msg status-err';
      return;
    }

    reportStatus.textContent = 'Reporte enviado. Gracias por ayudar a otros.';
    reportStatus.className = 'status-msg status-ok';
    reportPhone.value = '';
    reportDescription.value = '';
    reportLocationText.value = '';
    locationStatus.textContent = '';
    capturedLat = null;
    capturedLon = null;
    setTimeout(closeModal, 1200);
  }

  reportBtn.addEventListener('click', submitReport);

  // --- Map (elemento dominante de la pantalla) ---
  async function loadMap() {
    const map = L.map('map', { zoomControl: false }).setView([23.6345, -102.5528], 5);
    window.__radarMap = map;
    incidentLayer.addTo(map);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 12,
    }).addTo(map);

    // El contenedor vive en un layout flex (100dvh); en algunos navegadores móviles
    // el tamaño final se asienta después del primer paint. Forzamos un recálculo.
    setTimeout(() => map.invalidateSize(), 100);
    window.addEventListener('resize', () => map.invalidateSize());

    // Capa 1: fraude telefónico agregado por región (LADA) -- círculos rojos.
    const { data: ladaData, error: ladaError } = await supabase
      .from('fraud_counts_by_lada')
      .select('*')
      .gt('total_reports', 0);

    if (!ladaError && ladaData) {
      ladaData.forEach((row) => {
        const radius = Math.min(10 + row.total_reports * 3, 48);
        L.circleMarker([row.lat, row.lon], {
          radius,
          color: '#e34a4a',
          weight: 2,
          fillColor: '#e34a4a',
          fillOpacity: 0.35,
        })
          .addTo(map)
          .bindPopup(`<strong>${row.region}</strong><br>${row.total_reports} reporte${row.total_reports === 1 ? '' : 's'} de fraude telefónico`);
      });
    }

    // Capa 2: incidentes con ubicación GPS (robo, asalto, etc.) -- puntos individuales azules.
    // Coordenadas ya vienen difuminadas a ~1km desde el servidor, nunca la ubicación exacta.
    // Se trae una ventana de 90 días; el filtro de tiempo/categoría es client-side sobre este set.
    const ninetyDaysAgo = new Date(Date.now() - 90 * 24 * 60 * 60 * 1000).toISOString();
    const { data: incidentData, error: incidentError } = await supabase
      .from('reports')
      .select('lat, lon, category, description, entities, created_at')
      .not('lat', 'is', null)
      .gte('created_at', ninetyDaysAgo)
      .order('created_at', { ascending: false });

    if (!incidentError && incidentData) {
      allIncidents = incidentData;
      buildCategoryChips();
      renderIncidents();
    }
  }

  // --- Capa de incidentes filtrable (tiempo + categoría) ---
  let allIncidents = [];
  const activeCategories = new Set();
  const incidentLayer = L.layerGroup();
  const timeFilter = document.getElementById('time-filter');
  const categoryChipsEl = document.getElementById('category-chips');

  function buildCategoryChips() {
    const categories = [...new Set(allIncidents.map((r) => r.category || 'sin_clasificar'))];
    categories.forEach((c) => activeCategories.add(c));
    categoryChipsEl.innerHTML = categories
      .map((c) => `<span class="chip active" data-category="${c}">${c.replace(/_/g, ' ')}</span>`)
      .join('');
    categoryChipsEl.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        const cat = chip.dataset.category;
        if (activeCategories.has(cat)) {
          activeCategories.delete(cat);
          chip.classList.remove('active');
        } else {
          activeCategories.add(cat);
          chip.classList.add('active');
        }
        renderIncidents();
      });
    });
  }

  function renderIncidents() {
    incidentLayer.clearLayers();
    const days = Number(timeFilter.value);
    const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;

    allIncidents
      .filter((row) => new Date(row.created_at).getTime() >= cutoff)
      .filter((row) => activeCategories.has(row.category || 'sin_clasificar'))
      .forEach((row) => {
        const label = (row.category || 'incidente').replace(/_/g, ' ');
        const entityBits = [];
        if (row.entities?.time_of_day) entityBits.push(row.entities.time_of_day);
        if (row.entities?.weapon) entityBits.push(row.entities.weapon);
        if (row.entities?.vehicle) entityBits.push(row.entities.vehicle);
        const entityLine = entityBits.length ? `<br><span class="muted">${entityBits.join(' · ')}</span>` : '';

        L.circleMarker([row.lat, row.lon], {
          radius: 8,
          color: '#8ca0ff',
          weight: 2,
          fillColor: '#8ca0ff',
          fillOpacity: 0.5,
        })
          .addTo(incidentLayer)
          .bindPopup(`<strong>${label}</strong><br>${new Date(row.created_at).toLocaleDateString('es-MX')}${entityLine}`);
      });
  }

  const timeFilterLabel = document.getElementById('time-filter-label');
  timeFilter.addEventListener('input', () => {
    timeFilterLabel.textContent = `${timeFilter.value} días`;
    renderIncidents();
  });

  loadMap();

  // --- Resumen de zona con IA ---
  const zoneSummaryBtn = document.getElementById('zone-summary-btn');
  const zoneToast = document.getElementById('zone-toast');
  const zoneToastText = document.getElementById('zone-toast-text');
  const zoneToastClose = document.getElementById('zone-toast-close');

  function showToast(title, message, tone = '') {
    zoneToastText.innerHTML = '';
    const titleEl = document.createElement('span');
    titleEl.id = 'zone-toast-title';
    titleEl.textContent = title;
    zoneToastText.append(titleEl, document.createTextNode(message));

    zoneToast.classList.remove('tone-alert', 'tone-clear');
    if (tone) zoneToast.classList.add(tone);
    zoneToast.classList.add('visible');
    // Recorre los controles del mapa justo lo que mide el toast ya renderizado.
    document.documentElement.style.setProperty('--toast-offset', `${zoneToast.offsetHeight + 12}px`);
  }

  function hideToast() {
    zoneToast.classList.remove('visible');
    document.documentElement.style.setProperty('--toast-offset', '0px');
  }

  zoneToastClose.addEventListener('click', hideToast);

  // Punto verde de "aquí estás" / centro de la zona -- tercer color, distinto
  // del rojo (fraude por LADA) y del azul (incidentes con GPS).
  let zoneCenterMarker = null;
  function markZoneCenter(center) {
    if (zoneCenterMarker) window.__radarMap.removeLayer(zoneCenterMarker);
    zoneCenterMarker = L.circleMarker([center.lat, center.lng], {
      radius: 7,
      color: '#ffffff',
      weight: 2,
      fillColor: '#4ac97f',
      fillOpacity: 1,
    })
      .addTo(window.__radarMap)
      .bindPopup(center.isRealLocation ? 'Tu ubicación' : 'Centro de la zona analizada');
  }

  function getZoneCenter() {
    // Prioridad: tu ubicación real (GPS). Si no hay permiso, cae al centro visible del mapa.
    return new Promise((resolve) => {
      if (!navigator.geolocation) {
        resolve({ ...window.__radarMap.getCenter(), isRealLocation: false });
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude, isRealLocation: true }),
        () => resolve({ ...window.__radarMap.getCenter(), isRealLocation: false }),
        { timeout: 6000 }
      );
    });
  }

  zoneSummaryBtn.addEventListener('click', async () => {
    if (!window.__radarMap) return;
    showToast('Ubicación', 'Obteniendo tu ubicación...');

    const center = await getZoneCenter();
    const box = 0.15; // ~15km, "esta zona"

    // Llevar el mapa a la zona para que los marcadores rojos/azules se vean.
    // Zoom 12 es el máximo que sirve la capa de tiles (maxZoom: 12).
    window.__radarMap.setView([center.lat, center.lng], 12);
    markZoneCenter(center);

    showToast(
      center.isRealLocation ? 'Tu zona' : 'Zona en pantalla',
      center.isRealLocation
        ? 'Analizando reportes cerca de ti...'
        : 'No se pudo usar tu ubicación — analizando lo que ves en el mapa...'
    );

    const { data: nearby, error } = await supabase
      .from('reports')
      .select('category, description, created_at')
      .eq('status', 'published')
      .not('lat', 'is', null)
      .gte('lat', center.lat - box)
      .lte('lat', center.lat + box)
      .gte('lon', center.lng - box)
      .lte('lon', center.lng + box)
      .order('created_at', { ascending: false })
      .limit(15);

    if (error) {
      showToast('Error', 'No se pudo consultar los reportes. Intenta de nuevo.');
      return;
    }

    const count = nearby?.length || 0;
    const tone = count > 0 ? 'tone-alert' : 'tone-clear';
    const title = count > 0
      ? `${count} reporte${count === 1 ? '' : 's'} cerca`
      : 'Sin reportes cerca';

    try {
      const res = await fetch('https://ifcgwnbaiozuvjorkcoc.supabase.co/functions/v1/summarize-zone', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', apikey: SUPABASE_PUBLISHABLE_KEY },
        body: JSON.stringify({ reports: nearby || [] }),
      });
      const json = await res.json();
      showToast(title, json.summary || 'No se pudo generar el resumen.', tone);
    } catch {
      showToast(title, 'No se pudo generar el resumen. Intenta de nuevo.', tone);
    }
  });
</script>

</body>
</html>
